[project]
name = "osintverse"
version = "0.1.0"
description = "Official Python client for the OSINTverse SearchIn API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OSINTverse", email = "hi@osintverse.com" }]
keywords = ["osint", "searchin", "osintverse", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://osintverse.com"
Documentation = "https://osintverse.com/docs/python"
Repository = "https://github.com/dheerajydv19/osintverse-python"
Issues = "https://github.com/dheerajydv19/osintverse-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["osintverse"]
